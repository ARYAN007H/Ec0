name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle (cached)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build
        run: gradle build --stacktrace

      - name: Upload test reports (on any outcome)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore

      - name: Package desktop (Linux)
        run: |
          gradle :desktop:packageDistributionForCurrentOS --rerun
          find desktop/build/compose/binaries -type f 2>/dev/null | head -20 || true

      - name: Build Android APK
        run: gradle :android-app:assembleDebug

      - name: Upload desktop binaries
        uses: actions/upload-artifact@v4
        with:
          name: ec0-desktop-linux
          path: desktop/build/compose/binaries/**
          if-no-files-found: warn

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ec0-android-debug
          path: android-app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
