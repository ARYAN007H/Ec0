envelope:  # SynergyMessage.java
  fields:
    msg_type:  {type: string, values: [cmd, info]}          # TYPE_CMD / TYPE_INFO
    msg_body:  {type: object, of: SynergyCmd | SynergyInfo}
    src_role:  {type: string, observed_value: synergy}       # Config.SYNERGY_NOTIFICATION_CHANNEL_NAME
    category:  {type: string, json_key: category}            # ParserTag.TAG_CATEGORY
    timestamp: {type: long}                                   # System.currentTimeMillis()
    noncestr:  {type: long}                                   # new Random(timestamp).nextLong() in base send path
    signature: {type: long}                                   # constant 0x0FFFFFFF (268435455) in base send path; real scheme unknown
  send_path_evidence:
    file: base/socket/WebSocketConnectManager.java
    line: 558
    notes: >
      Base notification-channel send: Gson().toJson(new SynergyMessage.Builder()
      .setType(type).setBody(body).setSrcRole("synergy").setCategory(category)
      .setTimestamp(now).setNonceStr(new Random(now).nextLong())
      .setSignature(268435455L)). Signature/nonce derivation for other
      message classes is an OPEN UNKNOWN (T4 capture must verify).

