transport:
  websocket:
    client_library: okhttp3
    managers: [base/socket/WebSocketConnectManager.java, bus/websocket/WebSocketScene.java]
    default_port_list:              # buildWebClient default (WSCM:267, verbatim incl. duplicate)
      - "8080"
      - "39888"
      - "8080"
      - "49888"
      - "59888"
    computer_profile_port_list: default_port_list   # buildWebClientForComputer uses mPortList
    pad_profile_port_list:                          # buildWebClientForPad (WSCM ~:481, verbatim incl. duplicate)
      - "8792"
      - "39888"
      - "8792"
      - "49888"
      - "59888"
    effective_fallback_order_default: [8080, 39888, 49888, 59888]
    effective_fallback_order_pad:    [8792, 39888, 49888, 59888]
    fallback_mechanism: >
      RetryAndChangePortInterceptor: swaps port in URL across SERVERS list,
      then falls back to first port; retry count = list.size() at call sites
      (WSCM passes list.size() → 5 for the 5-entry lists; the 2-arg ctor
      default is 3 — RetryAndChangePortInterceptor.java:20)
    scene_server_port: "8792"       # WebSocketScene.java:190,212,237 (synergy.mServerPort)
    runtime_override: setWebSocketPortList(String)
    client_timeouts: {write_s: 50, read_s: 50, connect_s: 3, ping_s: 5, retry_on_connection_failure: true}
    tls:
      trust_model: APK-bundled CA pinning
      computer_profile: {cert_asset: server.cer,     tls_version: TLSv1.2, evidence: "WSCM:447 context.getAssets().open(\"server.cer\")"}
      pad_profile:      {cert_asset: server_pad.cer, tls_version: TLS,     evidence: "WSCM:477 context.getAssets().open(\"server_pad.cer\")"}
      trust_manager: custom X509TrustManager via trustManagerForCertificates(InputStream) + newEmptyKeyStore
      hostname_verifier: custom (obfuscated class oq3)
      socket_binding: binds to local P2P IP via SynergyLocalInfo.getLocalP2PIpByAsync() (falls back to default factory)
    softap_gateways: ["192.168.137.1", "192.168.49.*"]
    scene_registry_key: webSocketScene
  non_ports:
    - {value: "30409", actual: BI/telemetry track id (PCSynergyConnection:306), not_a_port: true}
    - {value: "3007701", actual: BI event id, not_a_port: true}

ksc:  # key/mouse/screen-cast control channel
