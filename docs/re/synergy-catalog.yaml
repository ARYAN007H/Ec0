transport:
  websocket:
    client_library: okhttp3
    managers: [base/socket/WebSocketConnectManager.java, bus/websocket/WebSocketScene.java]
    default_port_list:              # WebSocketConnectManager.java:267 (verbatim, incl. duplicate)
      - "8080"
      - "39888"
      - "8080"
      - "49888"
      - "59888"
    effective_fallback_order: [8080, 39888, 49888, 59888]
    fallback_mechanism: RetryAndChangePortInterceptor (3 retries, port replaced in URL, cycles back to first port)
    scene_server_port: "8792"       # WebSocketScene.java:190,212,237 (synergy.mServerPort)
    runtime_override: setWebSocketPortList(String)
    peer_profiles: [buildWebClientForComputer, buildWebClientForPad]
    tls:
      custom_trust_manager: true    # trustManagerForCertificates(InputStream) + newEmptyKeyStore
      cert_source: pairing-exchanged cert store (exact stream source UNKNOWN — T4)
    softap_gateways: ["192.168.137.1", "192.168.49.*"]
    scene_registry_key: webSocketScene
  non_ports:
    - {value: "30409", actual: BI/telemetry track id (PCSynergyConnection:306), not_a_port: true}
    - {value: "3007701", actual: BI event id, not_a_port: true}
    - {value: "3834", actual: legacy candidate in wiseconnect/connectold + senseless (unconfirmed)}

ksc:  # key/mouse/screen-cast control channel
  response_success_code: "00000000000000000000000000000000"  # RESPONSE_KSC_CODE, PCSynergyConnection:63
  request_wait_time_ms: 2000                                # REQUEST_KSC_WAIT_TIME
  state_key: pc_connect_state                                # Settings.Secure, PCSynergyConnection:61

