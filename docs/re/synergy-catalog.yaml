# ec0 — Synergy control-plane catalog (machine-readable)
# Extracted 2026-11-12 from decompiled OPSynergy 17.7.35 (com.oplus.linker)
# Sources: protocol/SynergyCmd.java, protocol/SynergyInfo.java,
# protocol/SynergyMessage.java, base/socket/*, bus/PCSynergyConnection.java,
# bus/websocket/WebSocketScene.java, com/oplus/synergy/utils/Config.java
# Provenance fields: constant name in decompiled source + file:line where useful.
# NOTE: static analysis only — runtime-observed values pending T4 capture.

meta:
  apk: OPSynergy-linker-17.7.35.apk
  package: com.oplus.linker.synergy
  serialization: Gson (@SerializedName annotations)
  proto_package: com.oplus.linker.synergy  # gRPC layer, see agent-1 T1 protos

envelope:  # SynergyMessage.java
  wire_name: synergy.message
  fields:
    msg_type:  {type: string, values: [cmd, info]}          # TYPE_CMD / TYPE_INFO
    msg_body:  {type: object, of: SynergyCmd | SynergyInfo}
    src_role:  {type: string, observed_value: synergy}       # Config.SYNERGY_NOTIFICATION_CHANNEL_NAME
    category:  {type: string, json_key: category}            # ParserTag.TAG_CATEGORY
    timestamp: {type: long}                                   # System.currentTimeMillis()
    noncestr:  {type: long}                                   # new Random(timestamp).nextLong() in base send path
    signature: {type: long}                                   # constant 0x0FFFFFFF (268435455) in base send path; real scheme unknown
  send_path_evidence:
    file: base/socket/WebSocketConnectManager.java
    line: 558
    notes: >
      Base notification-channel send: Gson().toJson(new SynergyMessage.Builder()
      .setType(type).setBody(body).setSrcRole("synergy").setCategory(category)
      .setTimestamp(now).setNonceStr(new Random(now).nextLong())
      .setSignature(268435455L)). Signature/nonce derivation for other
      message classes is an OPEN UNKNOWN (T4 capture must verify).

cmd_schema:  # SynergyCmd.java — msg_body when msg_type=cmd
  fields:
    cmd_type:  {type: string}
    cmd_body:  {type: object, nullable: true}
    cmd_value: {type: int, default: -1}
    reason:    {type: string, default: ""}

info_schema:  # SynergyInfo.java — msg_body when msg_type=info
  fields:
    info_type:  {type: string}
    info_body:  {type: object, nullable: true}
    info_value: {type: int}

