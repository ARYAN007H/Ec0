app-id: org.ec0.Desktop
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk17
command: ec0
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.mpris.MediaPlayer2.*
  - --filesystem=xdg-download
modules:
  - name: ec0-desktop
    buildsystem: simple
    build-commands:
      - install -Dm755 AppRun /app/bin/ec0
      - install -Dm644 packaging/systemd/ec0d.service /app/share/systemd/user/ec0d.service
    sources:
      - type: dir
        path: ../..
